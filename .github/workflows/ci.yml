name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Test (unit, jqwik properties ×10,000, Modulith/ArchUnit, Testcontainers)
        run: ./gradlew :api:test -PjqwikTries=10000 --no-daemon
      - name: Mutation testing (money modules, ≥ 70%)
        run: ./gradlew :api:pitest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: |
            api/build/reports/tests
            api/build/reports/jacoco
            api/build/reports/pitest
            api/build/spring-modulith-docs

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  images:
    if: github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: API image (Jib, linux/amd64 + linux/arm64)
        run: ./gradlew :api:jib -PappVersion=${{ github.sha }} -Pimage=ghcr.io/${{ github.repository_owner }}/lendhub-api --no-daemon
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lendhub-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/lendhub-web:latest
      - name: Trivy scan (fail on fixable criticals)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lendhub-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
