apiVersion: apps/v1
kind: Deployment
metadata:
  name: lendhub-web
  labels: { app.kubernetes.io/name: lendhub-web, app.kubernetes.io/part-of: insurehub }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lendhub-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lendhub-web, app.kubernetes.io/part-of: insurehub }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/momosto/lendhub-web:latest
          env: [{ name: API_URL, value: "https://lendhub-api.example.org" }]
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: lendhub-web
spec:
  selector: { app.kubernetes.io/name: lendhub-web }
  ports: [{ name: http, port: 80, targetPort: http }]
