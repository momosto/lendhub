# Local stack: PostgreSQL, RabbitMQ, LendHub API and the Angular back office.
#   docker compose up --build      → web http://localhost:4200, API http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lendhub
      POSTGRES_USER: lendhub
      POSTGRES_PASSWORD: lendhub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lendhub"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lendhub
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      LENDHUB_AMQP_ENABLED: "true"
      CORS_ORIGINS: http://localhost:4200
      # optional: point at the other InsureHub systems; blank = simulated adapters
      INSUREHUB_BASE_URL: ""
      PAYMENTS_BASE_URL: ""
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    build:
      context: web
    environment:
      API_URL: http://localhost:8080
    ports: ["4200:8080"]
    depends_on: [api]

volumes:
  pgdata:
