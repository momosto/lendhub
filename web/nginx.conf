server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Strict headers (the same set Cloudflare Pages serves from _headers)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http://localhost:8080; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'" always;

    location = /env.js { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
